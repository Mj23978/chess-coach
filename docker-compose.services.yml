services:
  pg:
    image: pgvector/pgvector:pg17
    container_name: "yt-pg"
    ports:
      - "54321:5432" 
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - yt_pg:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: "yt-redis"
    env_file: .env
    # Exposing the port locally (optional)
    ports:
      - "6379:6379"

  rustfs:
    image: rustfs/rustfs
    container_name: "yt-rustfs"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  inngest:
    image: inngest/inngest
    container_name: "yt-inngest"
    ports:
      - "8288:8288"
    env_file: .env
    command:
      - inngest 
      - dev 
      - -u http://host.docker.internal:3001/api/inngest
  
  qdrant:
    image: qdrant/qdrant
    ports:
      - '6333:6333' # REST API port
      - '6334:6334' # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_LOG_LEVEL=INFO
    restart: always
  
  seraxng:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8888}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
  yt_pg:
  tolgee_data:
  rustfs_data:
  rustfs_logs:
  qdrant_data: